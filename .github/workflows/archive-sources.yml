name: Arkivera källor som PDF

on:
  push:
    branches: [main]
    paths:
      - 'content/**/_index.md'
      - 'scripts/archive-sources.cjs'
      - '.github/workflows/archive-sources.yml'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installera Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Spara källor som PDF
        run: node scripts/archive-sources.cjs
      - name: Commit PDF-filer och källänkar till Hugo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/kallor content
          if ! git diff --cached --quiet; then
            git commit -m 'Archive cited sources as PDFs and link from Hugo reports [skip ci]'
            git push
          fi
