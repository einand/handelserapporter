name: Publicera händelserapporter med Hugo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Installera Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true
      - name: Förbered rapportinnehåll utan att ändra källfiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hugo-content/visit/historik
          cp index.md hugo-content/_index.md
          cp visit/index.md hugo-content/visit/_index.md
          if compgen -G 'visit/historik/*.md' > /dev/null; then
            cp visit/historik/*.md hugo-content/visit/historik/
          fi
      - name: Bygg mobilanpassad webbplats
        run: hugo --minify --contentDir hugo-content --destination public
      - name: Installera Node.js för lokala Mermaid-resurser
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lägg Mermaid i den publicerade webbplatsen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mermaid-build
          npm install --prefix .mermaid-build --no-save --no-audit --no-fund --ignore-scripts mermaid@11.12.2
          mkdir -p public/vendor/mermaid
          cp -R .mermaid-build/node_modules/mermaid/dist/. public/vendor/mermaid/
          test -s public/vendor/mermaid/mermaid.esm.min.mjs
          test -d public/vendor/mermaid/chunks
          if grep -R 'cdn.jsdelivr.net/npm/mermaid' public --include='*.html'; then
            echo 'External Mermaid CDN reference found' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
